name: Windows Desktop Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop tests
        run: npm test -- --runInBand
      - name: Validate JavaScript
        shell: bash
        run: |
          for file in main.js preload.js database/*.js scripts/*.js; do
            node --check "$file"
          done
      - name: Build Windows NSIS installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulseforge-windows-installer
          path: release/PulseForge-Gym-Management-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PulseForge-Gym-Management-Setup-*.exe
          generate_release_notes: true
