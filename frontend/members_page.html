<div class="page-header">
    <h1 class="page-title">إدارة الأعضاء</h1>
    <p class="page-subtitle">إدارة شاملة لجميع أعضاء النادي</p>
    <div class="header-actions">
        <button class="btn btn-primary" id="addMemberBtn">
            <i class="fas fa-user-plus"></i>
            إضافة عضو جديد
        </button>
        <button class="btn btn-secondary" id="exportMembersBtn">
            <i class="fas fa-download"></i>
            تصدير الأعضاء
        </button>
    </div>
</div>

<div class="members-table-container">
    <div class="table-header">
        <div class="search-filter">
            <input type="text" id="membersSearch" placeholder="البحث عن عضو..." class="search-input">
            <select id="membersFilter" class="filter-select">
                <option value="all">جميع الأعضاء</option>
                <option value="active">الأعضاء النشطون</option>
                <option value="inactive">الأعضاء غير النشطين</option>
                <option value="expired">الاشتراكات المنتهية</option>
            </select>
        </div>
    </div>
    <table class="members-table">
        <thead>
            <tr>
                <th>#</th>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>رقم الهاتف</th>
                <th>تاريخ الانضمام</th>
                <th>تاريخ انتهاء الاشتراك</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="membersTableBody">
            <!-- سيتم ملء بيانات الأعضاء هنا -->
        </tbody>
    </table>
    <div class="pagination">
        <button class="btn btn-secondary" id="prevPageBtn"><i class="fas fa-chevron-right"></i> السابق</button>
        <span id="pageInfo">الصفحة 1 من 5</span>
        <button class="btn btn-secondary" id="nextPageBtn">التالي <i class="fas fa-chevron-left"></i></button>
    </div>
</div>

<!-- نافذة منبثقة لإضافة/تعديل عضو -->
<div class="modal" id="memberModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>إضافة/تعديل عضو</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <form id="memberForm">
                <div class="form-group">
                    <label for="memberName">الاسم الكامل:</label>
                    <input type="text" id="memberName" required>
                </div>
                <div class="form-group">
                    <label for="memberEmail">البريد الإلكتروني:</label>
                    <input type="email" id="memberEmail">
                </div>
                <div class="form-group">
                    <label for="memberPhone">رقم الهاتف:</label>
                    <input type="tel" id="memberPhone">
                </div>
                <div class="form-group">
                    <label for="memberJoinDate">تاريخ الانضمام:</label>
                    <input type="date" id="memberJoinDate" required>
                </div>
                <div class="form-group">
                    <label for="memberExpiryDate">تاريخ انتهاء الاشتراك:</label>
                    <input type="date" id="memberExpiryDate" required>
                </div>
                <div class="form-group">
                    <label for="memberStatus">الحالة:</label>
                    <select id="memberStatus">
                        <option value="active">نشط</option>
                        <option value="inactive">غير نشط</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">حفظ</button>
            </form>
        </div>
    </div>
</div>

<style>
    .members-table-container {
        background: var(--white);
        border-radius: var(--border-radius-xl);
        padding: var(--spacing-6);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--gray-200);
        margin-top: var(--spacing-6);
    }

    .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--spacing-4);
    }

    .search-filter {
        display: flex;
        gap: var(--spacing-3);
    }

    .search-input,
    .filter-select {
        padding: var(--spacing-2) var(--spacing-3);
        border: 1px solid var(--gray-300);
        border-radius: var(--border-radius-md);
        font-size: var(--font-size-sm);
    }

    .members-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: var(--spacing-4);
    }

    .members-table th,
    .members-table td {
        padding: var(--spacing-3);
        text-align: right;
        border-bottom: 1px solid var(--gray-200);
    }

    .members-table th {
        background-color: var(--gray-100);
        font-weight: 600;
        color: var(--gray-700);
    }

    .members-table tbody tr:hover {
        background-color: var(--gray-50);
    }

    .status-badge {
        padding: 4px 8px;
        border-radius: var(--border-radius-full);
        font-size: var(--font-size-xs);
        font-weight: 600;
    }

    .status-badge.active {
        background-color: var(--success-light);
        color: var(--success-color);
    }

    .status-badge.inactive {
        background-color: var(--error-light);
        color: var(--error-color);
    }

    .status-badge.expired {
        background-color: var(--warning-light);
        color: var(--warning-color);
    }

    .action-buttons .btn {
        padding: 6px 10px;
        font-size: var(--font-size-xs);
        margin-left: var(--spacing-2);
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--spacing-4);
    }

    .pagination .btn {
        padding: var(--spacing-2) var(--spacing-4);
    }

    .form-group {
        margin-bottom: var(--spacing-4);
    }

    .form-group label {
        display: block;
        margin-bottom: var(--spacing-2);
        font-weight: 500;
        color: var(--gray-700);
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: var(--spacing-3);
        border: 1px solid var(--gray-300);
        border-radius: var(--border-radius-md);
        font-size: var(--font-size-base);
    }
</style>

<script>
    // JavaScript for members page functionality
    document.addEventListener("DOMContentLoaded", () => {
        const membersTableBody = document.getElementById("membersTableBody");
        const addMemberBtn = document.getElementById("addMemberBtn");
        const memberModal = document.getElementById("memberModal");
        const memberForm = document.getElementById("memberForm");
        const modalCloseBtn = memberModal.querySelector(".modal-close");

        let members = [
            { id: 1, name: "أحمد محمد", email: "ahmed@example.com", phone: "0501234567", joinDate: "2023-01-15", expiryDate: "2025-01-15", status: "active" },
            { id: 2, name: "فاطمة الزهراء", email: "fatima@example.com", phone: "0557654321", joinDate: "2023-03-01", expiryDate: "2024-12-31", status: "active" },
            { id: 3, name: "علي عبد الله", email: "ali@example.com", phone: "0569876543", joinDate: "2022-11-20", expiryDate: "2024-08-10", status: "expired" },
            { id: 4, name: "نورة خالد", email: "noura@example.com", phone: "0531122334", joinDate: "2024-02-10", expiryDate: "2025-02-10", status: "active" },
            { id: 5, name: "يوسف إبراهيم", email: "yousef@example.com", phone: "0598765432", joinDate: "2023-07-05", expiryDate: "2024-07-05", status: "inactive" }
        ];

        function renderMembers() {
            membersTableBody.innerHTML = "";
            members.forEach(member => {
                const row = membersTableBody.insertRow();
                row.innerHTML = `
                    <td>${member.id}</td>
                    <td>${member.name}</td>
                    <td>${member.email}</td>
                    <td>${member.phone}</td>
                    <td>${member.joinDate}</td>
                    <td>${member.expiryDate}</td>
                    <td><span class="status-badge ${member.status}">${member.status === 'active' ? 'نشط' : (member.status === 'inactive' ? 'غير نشط' : 'منتهي')}</span></td>
                    <td class="action-buttons">
                        <button class="btn btn-info edit-btn" data-id="${member.id}"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn btn-error delete-btn" data-id="${member.id}"><i class="fas fa-trash"></i> حذف</button>
                    </td>
                `;
            });
            addEventListenersToButtons();
        }

        function addEventListenersToButtons() {
            document.querySelectorAll(".edit-btn").forEach(button => {
                button.addEventListener("click", (e) => {
                    const memberId = parseInt(e.currentTarget.dataset.id);
                    const memberToEdit = members.find(m => m.id === memberId);
                    if (memberToEdit) {
                        document.getElementById("memberName").value = memberToEdit.name;
                        document.getElementById("memberEmail").value = memberToEdit.email;
                        document.getElementById("memberPhone").value = memberToEdit.phone;
                        document.getElementById("memberJoinDate").value = memberToEdit.joinDate;
                        document.getElementById("memberExpiryDate").value = memberToEdit.expiryDate;
                        document.getElementById("memberStatus").value = memberToEdit.status;
                        memberModal.dataset.editId = memberId;
                        memberModal.classList.add("show");
                    }
                });
            });

            document.querySelectorAll(".delete-btn").forEach(button => {
                button.addEventListener("click", (e) => {
                    const memberId = parseInt(e.currentTarget.dataset.id);
                    if (confirm("هل أنت متأكد من حذف هذا العضو؟")) {
                        members = members.filter(m => m.id !== memberId);
                        renderMembers();
                        // Optionally, send delete request to backend
                    }
                });
            });
        }

        addMemberBtn.addEventListener("click", () => {
            memberForm.reset();
            delete memberModal.dataset.editId;
            memberModal.classList.add("show");
        });

        modalCloseBtn.addEventListener("click", () => {
            memberModal.classList.remove("show");
        });

        memberForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const newMember = {
                name: document.getElementById("memberName").value,
                email: document.getElementById("memberEmail").value,
                phone: document.getElementById("memberPhone").value,
                joinDate: document.getElementById("memberJoinDate").value,
                expiryDate: document.getElementById("memberExpiryDate").value,
                status: document.getElementById("memberStatus").value
            };

            const editId = memberModal.dataset.editId;
            if (editId) {
                members = members.map(m => m.id === parseInt(editId) ? { ...m, ...newMember } : m);
            } else {
                newMember.id = members.length > 0 ? Math.max(...members.map(m => m.id)) + 1 : 1;
                members.push(newMember);
            }
            renderMembers();
            memberModal.classList.remove("show");
            // Optionally, send data to backend
        });

        renderMembers();
    });
</script>
