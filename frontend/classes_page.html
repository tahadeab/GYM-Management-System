<div class="page-header">
    <h1 class="page-title">الحصص والبرامج</h1>
    <p class="page-subtitle">إدارة جميع الحصص التدريبية والبرامج المتاحة</p>
    <div class="header-actions">
        <button class="btn btn-primary" id="addClassBtn">
            <i class="fas fa-plus-circle"></i>
            إضافة حصة جديدة
        </button>
        <button class="btn btn-secondary" id="exportClassesBtn">
            <i class="fas fa-download"></i>
            تصدير الحصص
        </button>
    </div>
</div>

<div class="classes-table-container">
    <div class="table-header">
        <div class="search-filter">
            <input type="text" id="classesSearch" placeholder="البحث عن حصة..." class="search-input">
            <select id="classesFilter" class="filter-select">
                <option value="all">جميع الحصص</option>
                <option value="active">حصص نشطة</option>
                <option value="upcoming">حصص قادمة</option>
            </select>
        </div>
    </div>
    <table class="classes-table">
        <thead>
            <tr>
                <th>#</th>
                <th>اسم الحصة</th>
                <th>المدرب</th>
                <th>التاريخ</th>
                <th>الوقت</th>
                <th>السعة</th>
                <th>المسجلون</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="classesTableBody">
            <!-- سيتم ملء بيانات الحصص هنا -->
        </tbody>
    </table>
    <div class="pagination">
        <button class="btn btn-secondary" id="prevClassPageBtn"><i class="fas fa-chevron-right"></i> السابق</button>
        <span id="classPageInfo">الصفحة 1 من 1</span>
        <button class="btn btn-secondary" id="nextClassPageBtn">التالي <i class="fas fa-chevron-left"></i></button>
    </div>
</div>

<!-- نافذة منبثقة لإضافة/تعديل حصة -->
<div class="modal" id="classModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>إضافة/تعديل حصة</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <form id="classForm">
                <div class="form-group">
                    <label for="className">اسم الحصة:</label>
                    <input type="text" id="className" required>
                </div>
                <div class="form-group">
                    <label for="classTrainer">المدرب:</label>
                    <input type="text" id="classTrainer">
                </div>
                <div class="form-group">
                    <label for="classDate">التاريخ:</label>
                    <input type="date" id="classDate" required>
                </div>
                <div class="form-group">
                    <label for="classTime">الوقت:</label>
                    <input type="time" id="classTime" required>
                </div>
                <div class="form-group">
                    <label for="classCapacity">السعة:</label>
                    <input type="number" id="classCapacity" min="1">
                </div>
                <div class="form-group">
                    <label for="classRegistered">المسجلون:</label>
                    <input type="number" id="classRegistered" min="0">
                </div>
                <div class="form-group">
                    <label for="classStatus">الحالة:</label>
                    <select id="classStatus">
                        <option value="active">نشطة</option>
                        <option value="cancelled">ملغاة</option>
                        <option value="completed">مكتملة</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">حفظ</button>
            </form>
        </div>
    </div>
</div>

<style>
    .classes-table-container {
        background: var(--white);
        border-radius: var(--border-radius-xl);
        padding: var(--spacing-6);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--gray-200);
        margin-top: var(--spacing-6);
    }

    .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--spacing-4);
    }

    .search-filter {
        display: flex;
        gap: var(--spacing-3);
    }

    .search-input,
    .filter-select {
        padding: var(--spacing-2) var(--spacing-3);
        border: 1px solid var(--gray-300);
        border-radius: var(--border-radius-md);
        font-size: var(--font-size-sm);
    }

    .classes-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: var(--spacing-4);
    }

    .classes-table th,
    .classes-table td {
        padding: var(--spacing-3);
        text-align: right;
        border-bottom: 1px solid var(--gray-200);
    }

    .classes-table th {
        background-color: var(--gray-100);
        font-weight: 600;
        color: var(--gray-700);
    }

    .classes-table tbody tr:hover {
        background-color: var(--gray-50);
    }

    .status-badge {
        padding: 4px 8px;
        border-radius: var(--border-radius-full);
        font-size: var(--font-size-xs);
        font-weight: 600;
    }

    .status-badge.active {
        background-color: var(--success-light);
        color: var(--success-color);
    }

    .status-badge.cancelled {
        background-color: var(--error-light);
        color: var(--error-color);
    }

    .status-badge.completed {
        background-color: var(--info-light);
        color: var(--info-color);
    }

    .action-buttons .btn {
        padding: 6px 10px;
        font-size: var(--font-size-xs);
        margin-left: var(--spacing-2);
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--spacing-4);
    }

    .pagination .btn {
        padding: var(--spacing-2) var(--spacing-4);
    }

    .form-group {
        margin-bottom: var(--spacing-4);
    }

    .form-group label {
        display: block;
        margin-bottom: var(--spacing-2);
        font-weight: 500;
        color: var(--gray-700);
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: var(--spacing-3);
        border: 1px solid var(--gray-300);
        border-radius: var(--border-radius-md);
        font-size: var(--font-size-base);
    }
</style>

<script>
    // JavaScript for classes page functionality
    document.addEventListener("DOMContentLoaded", () => {
        const classesTableBody = document.getElementById("classesTableBody");
        const addClassBtn = document.getElementById("addClassBtn");
        const classModal = document.getElementById("classModal");
        const classForm = document.getElementById("classForm");
        const modalCloseBtn = classModal.querySelector(".modal-close");

        let classes = [
            { id: 1, name: "يوغا صباحية", trainer: "سارة أحمد", date: "2025-08-18", time: "08:00", capacity: 20, registered: 15, status: "active" },
            { id: 2, name: "تدريب قوة", trainer: "محمد علي", date: "2025-08-18", time: "10:00", capacity: 15, registered: 12, status: "active" },
            { id: 3, name: "زومبا", trainer: "ليلى فهد", date: "2025-08-19", time: "17:00", capacity: 25, registered: 20, status: "active" }
        ];

        function renderClasses() {
            classesTableBody.innerHTML = "";
            classes.forEach(cls => {
                const row = classesTableBody.insertRow();
                row.innerHTML = `
                    <td>${cls.id}</td>
                    <td>${cls.name}</td>
                    <td>${cls.trainer}</td>
                    <td>${cls.date}</td>
                    <td>${cls.time}</td>
                    <td>${cls.registered}/${cls.capacity}</td>
                    <td><span class="status-badge ${cls.status}">${cls.status === 'active' ? 'نشطة' : (cls.status === 'cancelled' ? 'ملغاة' : 'مكتملة')}</span></td>
                    <td class="action-buttons">
                        <button class="btn btn-info edit-btn" data-id="${cls.id}"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn btn-error delete-btn" data-id="${cls.id}"><i class="fas fa-trash"></i> حذف</button>
                    </td>
                `;
            });
            addEventListenersToButtons();
        }

        function addEventListenersToButtons() {
            document.querySelectorAll(".edit-btn").forEach(button => {
                button.addEventListener("click", (e) => {
                    const classId = parseInt(e.currentTarget.dataset.id);
                    const classToEdit = classes.find(c => c.id === classId);
                    if (classToEdit) {
                        document.getElementById("className").value = classToEdit.name;
                        document.getElementById("classTrainer").value = classToEdit.trainer;
                        document.getElementById("classDate").value = classToEdit.date;
                        document.getElementById("classTime").value = classToEdit.time;
                        document.getElementById("classCapacity").value = classToEdit.capacity;
                        document.getElementById("classRegistered").value = classToEdit.registered;
                        document.getElementById("classStatus").value = classToEdit.status;
                        classModal.dataset.editId = classId;
                        classModal.classList.add("show");
                    }
                });
            });

            document.querySelectorAll(".delete-btn").forEach(button => {
                button.addEventListener("click", (e) => {
                    const classId = parseInt(e.currentTarget.dataset.id);
                    if (confirm("هل أنت متأكد من حذف هذه الحصة؟")) {
                        classes = classes.filter(c => c.id !== classId);
                        renderClasses();
                        // Optionally, send delete request to backend
                    }
                });
            });
        }

        addClassBtn.addEventListener("click", () => {
            classForm.reset();
            delete classModal.dataset.editId;
            classModal.classList.add("show");
        });

        modalCloseBtn.addEventListener("click", () => {
            classModal.classList.remove("show");
        });

        classForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const newClass = {
                name: document.getElementById("className").value,
                trainer: document.getElementById("classTrainer").value,
                date: document.getElementById("classDate").value,
                time: document.getElementById("classTime").value,
                capacity: parseInt(document.getElementById("classCapacity").value),
                registered: parseInt(document.getElementById("classRegistered").value),
                status: document.getElementById("classStatus").value
            };

            const editId = classModal.dataset.editId;
            if (editId) {
                classes = classes.map(c => c.id === parseInt(editId) ? { ...c, ...newClass } : c);
            } else {
                newClass.id = classes.length > 0 ? Math.max(...classes.map(c => c.id)) + 1 : 1;
                classes.push(newClass);
            }
            renderClasses();
            classModal.classList.remove("show");
            // Optionally, send data to backend
        });

        renderClasses();
    });
</script>
